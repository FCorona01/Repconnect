name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/repconnect_test
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/repconnect_test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Tests run against a real PostgreSQL, never a mock. Authorization proven
    # against a fake database is not proven.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      # The seed SQL is generated from src/lib/taxonomy/seed/*.ts. If someone
      # edits the source without regenerating (or edits the generated SQL by
      # hand), the two silently disagree about the taxonomy. Fail instead.
      - name: Taxonomy seed is in sync with its source
        run: |
          pnpm db:generate-seed
          if ! git diff --quiet -- supabase/migrations/0008_taxonomy_seed.sql; then
            echo "::error::0008_taxonomy_seed.sql is stale. Run 'pnpm db:generate-seed' and commit the result."
            git diff -- supabase/migrations/0008_taxonomy_seed.sql
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (includes the authorization matrix and RLS guarantees)
        run: pnpm test

      - name: Verify security invariants
        run: pnpm exec tsx scripts/verify-security.ts

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (desktop and mobile viewports)
        run: pnpm exec playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails the build if a credential is ever committed. Cheaper to prevent
      # than to rotate.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
